version: '3.8'

services:
    # Laravel PHP Service
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_app
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - laravel_network
        environment:
            DB_HOST: db
            DB_DATABASE: my_database
            DB_USERNAME: root
            DB_PASSWORD: root

    # Nginx Service
    webserver:
        image: nginx:alpine
        container_name: nginx_webserver
        restart: unless-stopped
        ports:
            - "8081:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel_network

    # MySQL Service
    db:
        image: mysql:latest
        container_name: my_mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: my_database
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3309:3306"
        networks:
            - laravel_network

    # phpMyAdmin Service
    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: my_phpmyadmin
        restart: always
        depends_on:
            - db
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8001:80" # Host port 8001 maps to container port 80
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge

volumes:
    dbdata:
